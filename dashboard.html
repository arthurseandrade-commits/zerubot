<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeruBot Dashboard - Painel de Controle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #00ff88;
      --primary-dark: #00cc6a;
      --secondary: #ff0080;
      --accent: #00d4ff;
      --bg-dark: #0a0a0f;
      --bg-darker: #050508;
      --bg-card: #12121a;
      --bg-card-hover: #1a1a25;
      --text: #e0e0e0;
      --text-muted: #888;
      --border: #252530;
      --success: #00ff88;
      --warning: #ffaa00;
      --danger: #ff0055;
    }

    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated Background Grid */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: grid-move 20s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes grid-move {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    /* Glowing Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: var(--primary);
      top: -200px;
      right: -200px;
      animation: float-1 15s ease-in-out infinite;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: var(--secondary);
      bottom: -150px;
      left: -150px;
      animation: float-2 20s ease-in-out infinite;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: var(--accent);
      top: 50%;
      left: 50%;
      animation: float-3 18s ease-in-out infinite;
    }

    @keyframes float-1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-100px, 100px); }
    }

    @keyframes float-2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(100px, -100px); }
    }

    @keyframes float-3 {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-150px, -150px); }
    }

    /* Layout */
    .dashboard {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-darker);
      border-right: 1px solid var(--border);
      padding: 30px 20px;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      padding: 15px;
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .logo-icon {
      font-size: 32px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .logo-text h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-text p {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-section {
      margin-bottom: 30px;
    }

    .nav-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      margin-bottom: 5px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 3px;
      height: 100%;
      background: var(--primary);
      transform: scaleY(0);
      transition: transform 0.3s ease;
    }

    .nav-item:hover {
      background: var(--bg-card);
      border-color: var(--border);
      transform: translateX(5px);
    }

    .nav-item.active {
      background: var(--bg-card);
      border-color: var(--primary);
    }

    .nav-item.active::before {
      transform: scaleY(1);
    }

    .nav-icon {
      font-size: 18px;
    }

    .nav-label {
      font-size: 14px;
      font-weight: 700;
    }

    /* Main Content */
    .main-content {
      margin-left: 280px;
      flex: 1;
      padding: 30px;
    }

    .header {
      margin-bottom: 40px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .page-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--text), var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--bg-dark);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      background: var(--bg-card-hover);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #cc0044);
      color: white;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      border-color: var(--primary);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
    }

    .stat-card:hover::before {
      transform: scaleX(1);
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .stat-icon {
      font-size: 24px;
      opacity: 0.5;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 5px;
    }

    .stat-change {
      font-size: 12px;
      color: var(--success);
      font-weight: 700;
    }

    .stat-change.negative {
      color: var(--danger);
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: var(--primary);
      box-shadow: 0 5px 20px rgba(0, 255, 136, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--text);
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 25px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 12px 15px;
      background: var(--bg-darker);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-help {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-darker);
      border: 1px solid var(--border);
      transition: 0.4s;
      border-radius: 24px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: var(--text-muted);
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .toggle-slider {
      background: var(--primary);
      border-color: var(--primary);
    }

    input:checked + .toggle-slider:before {
      transform: translateX(26px);
      background: var(--bg-dark);
    }

    /* Category List */
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .category-item {
      background: var(--bg-darker);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .category-item:hover {
      border-color: var(--primary);
      transform: translateX(5px);
    }

    .category-info {
      flex: 1;
    }

    .category-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 5px;
    }

    .category-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .category-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 16px;
    }

    .icon-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--primary);
      color: var(--primary);
    }

    .icon-btn.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      animation: modal-appear 0.3s ease;
    }

    @keyframes modal-appear {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      margin-bottom: 30px;
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: var(--text);
    }

    .modal-footer {
      margin-top: 30px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 20px;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      z-index: 2000;
      animation: toast-appear 0.3s ease;
      display: none;
    }

    .toast.active {
      display: block;
    }

    @keyframes toast-appear {
      from {
        opacity: 0;
        transform: translateX(400px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .toast-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .toast-icon {
      font-size: 20px;
    }

    .toast-title {
      font-weight: 700;
      font-size: 14px;
    }

    .toast-message {
      font-size: 13px;
      color: var(--text-muted);
    }

    .toast.success {
      border-left-color: var(--success);
    }

    .toast.error {
      border-left-color: var(--danger);
    }

    .toast.warning {
      border-left-color: var(--warning);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .header-top {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }

      .page-title {
        font-size: 28px;
      }
    }

    /* Loading Animation */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function Dashboard() {
      const [currentPage, setCurrentPage] = useState('overview');
      const [categories, setCategories] = useState([
        { id: 1, name: 'Suporte', description: 'Canal de tickets e ajuda aos membros', enabled: true },
        { id: 2, name: 'Moderação', description: 'Logs e ações de moderação', enabled: true },
        { id: 3, name: 'Anúncios', description: 'Notificações e avisos importantes', enabled: false },
      ]);
      const [modalOpen, setModalOpen] = useState(false);
      const [editingCategory, setEditingCategory] = useState(null);
      const [toast, setToast] = useState({ show: false, type: '', title: '', message: '' });
      const [settings, setSettings] = useState({
        prefix: '/',
        language: 'pt-BR',
        aiEnabled: true,
        autoModeration: false,
        welcomeMessage: 'Bem-vindo ao servidor!',
      });

      const showToast = (type, title, message) => {
        setToast({ show: true, type, title, message });
        setTimeout(() => setToast({ show: false, type: '', title: '', message: '' }), 3000);
      };

      const handleAddCategory = () => {
        setEditingCategory(null);
        setModalOpen(true);
      };

      const handleEditCategory = (category) => {
        setEditingCategory(category);
        setModalOpen(true);
      };

      const handleDeleteCategory = (id) => {
        setCategories(categories.filter(cat => cat.id !== id));
        showToast('success', 'Sucesso', 'Categoria removida com sucesso!');
      };

      const handleSaveCategory = (formData) => {
        if (editingCategory) {
          setCategories(categories.map(cat => 
            cat.id === editingCategory.id ? { ...cat, ...formData } : cat
          ));
          showToast('success', 'Atualizado', 'Categoria atualizada com sucesso!');
        } else {
          const newCategory = {
            id: Math.max(...categories.map(c => c.id), 0) + 1,
            ...formData,
            enabled: true
          };
          setCategories([...categories, newCategory]);
          showToast('success', 'Criado', 'Nova categoria adicionada!');
        }
        setModalOpen(false);
      };

      const handleSaveSettings = () => {
        showToast('success', 'Salvo', 'Configurações salvas com sucesso!');
      };

      return (
        <div className="dashboard">
          <Sidebar currentPage={currentPage} setCurrentPage={setCurrentPage} />
          
          <div className="main-content">
            {currentPage === 'overview' && (
              <OverviewPage 
                categories={categories}
                settings={settings}
              />
            )}
            
            {currentPage === 'categories' && (
              <CategoriesPage 
                categories={categories}
                onAdd={handleAddCategory}
                onEdit={handleEditCategory}
                onDelete={handleDeleteCategory}
              />
            )}
            
            {currentPage === 'settings' && (
              <SettingsPage 
                settings={settings}
                setSettings={setSettings}
                onSave={handleSaveSettings}
              />
            )}
            
            {currentPage === 'commands' && <CommandsPage />}
            {currentPage === 'logs' && <LogsPage />}
          </div>

          {modalOpen && (
            <CategoryModal 
              category={editingCategory}
              onClose={() => setModalOpen(false)}
              onSave={handleSaveCategory}
            />
          )}

          {toast.show && (
            <Toast 
              type={toast.type}
              title={toast.title}
              message={toast.message}
            />
          )}
        </div>
      );
    }

    function Sidebar({ currentPage, setCurrentPage }) {
      const navItems = [
        { id: 'overview', icon: '📊', label: 'Visão Geral', section: 'Dashboard' },
        { id: 'categories', icon: '📁', label: 'Categorias', section: 'Dashboard' },
        { id: 'commands', icon: '⚡', label: 'Comandos', section: 'Bot' },
        { id: 'settings', icon: '⚙️', label: 'Configurações', section: 'Bot' },
        { id: 'logs', icon: '📝', label: 'Logs', section: 'Sistema' },
      ];

      const sections = [...new Set(navItems.map(item => item.section))];

      return (
        <div className="sidebar">
          <div className="logo">
            <div className="logo-icon">🤖</div>
            <div className="logo-text">
              <h1>ZeruBot</h1>
              <p>Dashboard</p>
            </div>
          </div>

          {sections.map(section => (
            <div key={section} className="nav-section">
              <div className="nav-title">{section}</div>
              {navItems
                .filter(item => item.section === section)
                .map(item => (
                  <div 
                    key={item.id}
                    className={`nav-item ${currentPage === item.id ? 'active' : ''}`}
                    onClick={() => setCurrentPage(item.id)}
                  >
                    <span className="nav-icon">{item.icon}</span>
                    <span className="nav-label">{item.label}</span>
                  </div>
                ))}
            </div>
          ))}
        </div>
      );
    }

    function OverviewPage({ categories, settings }) {
      return (
        <>
          <div className="header">
            <div className="header-top">
              <h1 className="page-title">Visão Geral</h1>
              <div className="header-actions">
                <button className="btn btn-primary">
                  <span>🔄 Sincronizar</span>
                </button>
              </div>
            </div>
          </div>

          <div className="stats-grid">
            <div className="stat-card">
              <div className="stat-header">
                <span className="stat-label">Servidores</span>
                <span className="stat-icon">🌐</span>
              </div>
              <div className="stat-value">1,234</div>
              <div className="stat-change">↑ +12% este mês</div>
            </div>

            <div className="stat-card">
              <div className="stat-header">
                <span className="stat-label">Usuários Ativos</span>
                <span className="stat-icon">👥</span>
              </div>
              <div className="stat-value">45.2K</div>
              <div className="stat-change">↑ +8% esta semana</div>
            </div>

            <div className="stat-card">
              <div className="stat-header">
                <span className="stat-label">Comandos/dia</span>
                <span className="stat-icon">⚡</span>
              </div>
              <div className="stat-value">8,567</div>
              <div className="stat-change">↑ +23% hoje</div>
            </div>

            <div className="stat-card">
              <div className="stat-header">
                <span className="stat-label">Uptime</span>
                <span className="stat-icon">🟢</span>
              </div>
              <div className="stat-value">99.9%</div>
              <div className="stat-change">Últimos 30 dias</div>
            </div>
          </div>

          <div className="card">
            <div className="card-header">
              <h2 className="card-title">Status do Sistema</h2>
            </div>
            <div className="form-group">
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '15px' }}>
                <span>Bot Online</span>
                <span style={{ color: 'var(--success)', fontWeight: 700 }}>✓ Ativo</span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '15px' }}>
                <span>IA Habilitada</span>
                <span style={{ color: settings.aiEnabled ? 'var(--success)' : 'var(--danger)', fontWeight: 700 }}>
                  {settings.aiEnabled ? '✓ Sim' : '✗ Não'}
                </span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '15px' }}>
                <span>Categorias Ativas</span>
                <span style={{ color: 'var(--accent)', fontWeight: 700 }}>
                  {categories.filter(c => c.enabled).length}/{categories.length}
                </span>
              </div>
            </div>
          </div>
        </>
      );
    }

    function CategoriesPage({ categories, onAdd, onEdit, onDelete }) {
      return (
        <>
          <div className="header">
            <div className="header-top">
              <h1 className="page-title">Gerenciar Categorias</h1>
              <div className="header-actions">
                <button className="btn btn-primary" onClick={onAdd}>
                  <span>➕ Nova Categoria</span>
                </button>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-header">
              <h2 className="card-title">Categorias do Servidor</h2>
              <span style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                {categories.length} categoria(s) configurada(s)
              </span>
            </div>

            <div className="category-list">
              {categories.map(category => (
                <div key={category.id} className="category-item">
                  <div className="category-info">
                    <div className="category-name">
                      {category.name}
                      {category.enabled && (
                        <span style={{ 
                          marginLeft: '10px', 
                          fontSize: '11px', 
                          color: 'var(--success)',
                          background: 'rgba(0, 255, 136, 0.1)',
                          padding: '2px 8px',
                          borderRadius: '4px'
                        }}>
                          ATIVA
                        </span>
                      )}
                    </div>
                    <div className="category-desc">{category.description}</div>
                  </div>
                  <div className="category-actions">
                    <button className="icon-btn" onClick={() => onEdit(category)}>
                      ✏️
                    </button>
                    <button className="icon-btn danger" onClick={() => onDelete(category.id)}>
                      🗑️
                    </button>
                  </div>
                </div>
              ))}

              {categories.length === 0 && (
                <div style={{ 
                  textAlign: 'center', 
                  padding: '60px 20px',
                  color: 'var(--text-muted)'
                }}>
                  <div style={{ fontSize: '48px', marginBottom: '20px' }}>📁</div>
                  <h3>Nenhuma categoria configurada</h3>
                  <p style={{ marginTop: '10px' }}>Clique em "Nova Categoria" para começar</p>
                </div>
              )}
            </div>
          </div>
        </>
      );
    }

    function SettingsPage({ settings, setSettings, onSave }) {
      return (
        <>
          <div className="header">
            <div className="header-top">
              <h1 className="page-title">Configurações</h1>
            </div>
          </div>

          <div className="card">
            <div className="card-header">
              <h2 className="card-title">Configurações Gerais</h2>
            </div>

            <div className="form-group">
              <label className="form-label">Prefixo de Comandos</label>
              <input 
                type="text" 
                className="form-input"
                value={settings.prefix}
                onChange={(e) => setSettings({...settings, prefix: e.target.value})}
                maxLength="5"
              />
              <div className="form-help">Símbolo usado antes dos comandos (ex: /, !, ?)</div>
            </div>

            <div className="form-group">
              <label className="form-label">Idioma</label>
              <select 
                className="form-select"
                value={settings.language}
                onChange={(e) => setSettings({...settings, language: e.target.value})}
              >
                <option value="pt-BR">Português (Brasil)</option>
                <option value="en-US">English (US)</option>
                <option value="es-ES">Español</option>
              </select>
            </div>

            <div className="form-group">
              <label className="form-label">Mensagem de Boas-vindas</label>
              <textarea 
                className="form-textarea"
                value={settings.welcomeMessage}
                onChange={(e) => setSettings({...settings, welcomeMessage: e.target.value})}
                placeholder="Digite a mensagem de boas-vindas para novos membros..."
              />
              <div className="form-help">Mensagem enviada quando um novo membro entra no servidor</div>
            </div>
          </div>

          <div className="card">
            <div className="card-header">
              <h2 className="card-title">Recursos do Bot</h2>
            </div>

            <div className="form-group" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <div className="form-label" style={{ marginBottom: '5px' }}>Respostas com IA</div>
                <div className="form-help">Permite que o bot use IA para responder perguntas</div>
              </div>
              <label className="toggle-switch">
                <input 
                  type="checkbox"
                  checked={settings.aiEnabled}
                  onChange={(e) => setSettings({...settings, aiEnabled: e.target.checked})}
                />
                <span className="toggle-slider"></span>
              </label>
            </div>

            <div className="form-group" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <div className="form-label" style={{ marginBottom: '5px' }}>Moderação Automática</div>
                <div className="form-help">Detecta e remove automaticamente conteúdo inadequado</div>
              </div>
              <label className="toggle-switch">
                <input 
                  type="checkbox"
                  checked={settings.autoModeration}
                  onChange={(e) => setSettings({...settings, autoModeration: e.target.checked})}
                />
                <span className="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div style={{ display: 'flex', gap: '10px', justifyContent: 'flex-end' }}>
            <button className="btn btn-secondary">
              <span>↺ Resetar</span>
            </button>
            <button className="btn btn-primary" onClick={onSave}>
              <span>💾 Salvar Alterações</span>
            </button>
          </div>
        </>
      );
    }

    function CommandsPage() {
      const commands = [
        { name: '/ask', description: 'Faz uma pergunta à IA', usage: '/ask [pergunta]', category: 'IA' },
        { name: '/help', description: 'Mostra ajuda', usage: '/help [comando]', category: 'Utilidade' },
        { name: '/ping', description: 'Verifica latência', usage: '/ping', category: 'Utilidade' },
      ];

      return (
        <>
          <div className="header">
            <div className="header-top">
              <h1 className="page-title">Comandos</h1>
            </div>
          </div>

          <div className="card">
            <div className="card-header">
              <h2 className="card-title">Lista de Comandos</h2>
            </div>

            {commands.map((cmd, idx) => (
              <div key={idx} style={{ 
                padding: '20px',
                background: 'var(--bg-darker)',
                borderRadius: '8px',
                marginBottom: '15px',
                border: '1px solid var(--border)'
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <span style={{ 
                    fontFamily: "'Orbitron', sans-serif",
                    fontSize: '18px',
                    fontWeight: 700,
                    color: 'var(--primary)'
                  }}>
                    {cmd.name}
                  </span>
                  <span style={{ 
                    fontSize: '11px',
                    background: 'var(--bg-card)',
                    padding: '4px 10px',
                    borderRadius: '12px',
                    border: '1px solid var(--border)'
                  }}>
                    {cmd.category}
                  </span>
                </div>
                <div style={{ fontSize: '14px', color: 'var(--text-muted)', marginBottom: '8px' }}>
                  {cmd.description}
                </div>
                <div style={{ 
                  fontFamily: "'Space Mono', monospace",
                  fontSize: '13px',
                  color: 'var(--accent)',
                  background: 'var(--bg-dark)',
                  padding: '8px 12px',
                  borderRadius: '6px',
                  borderLeft: '3px solid var(--primary)'
                }}>
                  {cmd.usage}
                </div>
              </div>
            ))}
          </div>
        </>
      );
    }

    function LogsPage() {
      const logs = [
        { time: '14:32:15', type: 'info', message: 'Bot conectado com sucesso' },
        { time: '14:30:42', type: 'success', message: 'Comando /ask executado por @user123' },
        { time: '14:28:11', type: 'warning', message: 'Taxa de requisições alta detectada' },
        { time: '14:25:03', type: 'error', message: 'Falha ao conectar com API externa' },
      ];

      const getLogColor = (type) => {
        switch(type) {
          case 'success': return 'var(--success)';
          case 'warning': return 'var(--warning)';
          case 'error': return 'var(--danger)';
          default: return 'var(--accent)';
        }
      };

      return (
        <>
          <div className="header">
            <div className="header-top">
              <h1 className="page-title">Logs do Sistema</h1>
              <div className="header-actions">
                <button className="btn btn-secondary">
                  <span>🗑️ Limpar Logs</span>
                </button>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-header">
              <h2 className="card-title">Atividades Recentes</h2>
            </div>

            {logs.map((log, idx) => (
              <div key={idx} style={{ 
                padding: '15px',
                background: 'var(--bg-darker)',
                borderRadius: '6px',
                marginBottom: '10px',
                borderLeft: `3px solid ${getLogColor(log.type)}`,
                display: 'flex',
                gap: '15px',
                alignItems: 'center'
              }}>
                <span style={{ 
                  fontFamily: "'Space Mono', monospace",
                  fontSize: '12px',
                  color: 'var(--text-muted)',
                  minWidth: '70px'
                }}>
                  {log.time}
                </span>
                <span style={{ 
                  fontSize: '11px',
                  textTransform: 'uppercase',
                  fontWeight: 700,
                  color: getLogColor(log.type),
                  minWidth: '70px'
                }}>
                  {log.type}
                </span>
                <span style={{ fontSize: '14px' }}>{log.message}</span>
              </div>
            ))}
          </div>
        </>
      );
    }

    function CategoryModal({ category, onClose, onSave }) {
      const [formData, setFormData] = useState({
        name: category?.name || '',
        description: category?.description || ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (formData.name.trim() && formData.description.trim()) {
          onSave(formData);
        }
      };

      return (
        <div className="modal active" onClick={onClose}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">
                {category ? '✏️ Editar Categoria' : '➕ Nova Categoria'}
              </h2>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label className="form-label">Nome da Categoria</label>
                <input 
                  type="text"
                  className="form-input"
                  value={formData.name}
                  onChange={(e) => setFormData({...formData, name: e.target.value})}
                  placeholder="Ex: Suporte, Moderação, Anúncios"
                  required
                />
              </div>

              <div className="form-group">
                <label className="form-label">Descrição</label>
                <textarea 
                  className="form-textarea"
                  value={formData.description}
                  onChange={(e) => setFormData({...formData, description: e.target.value})}
                  placeholder="Descreva o propósito desta categoria..."
                  required
                />
              </div>

              <div className="modal-footer">
                <button type="button" className="btn btn-secondary" onClick={onClose}>
                  <span>Cancelar</span>
                </button>
                <button type="submit" className="btn btn-primary">
                  <span>{category ? '💾 Salvar' : '➕ Criar'}</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function Toast({ type, title, message }) {
      const icons = {
        success: '✓',
        error: '✗',
        warning: '⚠'
      };

      return (
        <div className={`toast active ${type}`}>
          <div className="toast-header">
            <span className="toast-icon">{icons[type]}</span>
            <span className="toast-title">{title}</span>
          </div>
          <div className="toast-message">{message}</div>
        </div>
      );
    }

    ReactDOM.render(<Dashboard />, document.getElementById('root'));
  </script>
</body>
</html>
